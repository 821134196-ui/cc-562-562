# HTTP
quarkus.http.port=8080

# SQLite 数据源（本地文件，开箱即用）
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
# busy_timeout/foreign_keys 为连接级参数，放 URL 中确保连接池每个新连接都生效；
# WAL 为数据库级持久属性，在 DataInitializer 中设置一次即可
quarkus.datasource.jdbc.url=jdbc:sqlite:${POS_DB_PATH:pos.db}?busy_timeout=5000&foreign_keys=true
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=10S

# Hibernate ORM + SQLite 社区方言
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.mapping.timezone.default-storage=NORMALIZE

# 业务参数：自带杯折扣比例（百分比）
pos.pricing.personal-discount-percent=5
