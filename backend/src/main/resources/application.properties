# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# ---- Datasource: local SQLite file (WAL so concurrent readers don't block the single writer) ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/data/cupcheck.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
quarkus.datasource.jdbc.max-size=4

# ---- Hibernate ----
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=false

# ---- Business rules ----
# 自带杯折扣：每件符合条件的饮品减免金额（分）
app.cup-discount-cents=300
app.shop-name=自带杯咖啡站

# ---- Test profile: isolated DB file, fresh schema per run ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/target/test-cupcheck.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
%test.quarkus.datasource.jdbc.max-size=4
